# Baseline 1 configuration for the FlowTransformer++ NetFlow pipeline.

[paths]
data = "data/NF-CICIDS2018-v3.parquet"
out = "out"

[dataset]
time_col = "FLOW_START_MILLISECONDS"

[dataset.targets]
binary = "Label"
family = "Attack"

[dataset.window]
len = 8
stride = 8
drop_incomplete = false
pad_value = -1

[dataset.transforms]
clip_quantiles = [1.0, 99.0]
noise_std = 0.0

[dataset.split]
splits = [0.7, 0.15, 0.15]
mode = "temporal"
purge = 1

[dataset.polars]
engine = "cpu"

[dataloaders]
batch_size = 256
num_workers = 4
pin_memory = true
balance_train = false
drop_last_train = false
seed = 42

[model]
device = "cuda"
d_model = 256
nhead = 8
num_layers = 6
dim_feedforward = 1024
dropout = 0.1

[model.aux_class_dims]
protocol = 256
l7_proto = 256
src_port = 65538
dst_port = 65538

[model.aux_reg_dims]
bytes = 2
pkts = 2

[model.aux_gaussian_dims]

[train]
epochs = 10
lr = 1e-4
weight_decay = 1e-2
amp = true
grad_clip_norm = 1.0

[train.loss_weights]
binary = 1.0
family = 1.0
protocol = 0.2
l7_proto = 0.2
src_port = 0.1
dst_port = 0.1
bytes = 0.2
pkts = 0.2

[train.scheduler]
name = "cosine"
t_max = 10