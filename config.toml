# Baseline 1 configuration for the FlowTransformer++ NetFlow pipeline.

[paths]
data = "data/NF-CICIDS2018-v3.parquet"
out = "out"

[dataset]
time_col = "FLOW_START_MILLISECONDS"

[dataset.targets]
binary = "Label"
family = "Attack"

[dataset.window]
len = 8
stride = 8
drop_incomplete = false
pad_value = -1

[dataset.transforms]
clip_quantiles = [1.0, 99.0]
noise_std = 0.0

[dataset.split]
splits = [0.7, 0.15, 0.15]
mode = "temporal"
purge = 1

[dataset.polars]
engine = "cpu"

[dataloaders]
batch_size = 256
num_workers = 4
pin_memory = true
balance_train = false
drop_last_train = false
seed = 42

[model]
device = "cuda"
d_model = 256
nhead = 8
num_layers = 6
dim_feedforward = 1024
dropout = 0.1

[train]
epochs = 10
lr = 1e-4
weight_decay = 1e-2
