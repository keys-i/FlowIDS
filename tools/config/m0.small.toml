description = "8-flow causal FlowTransformer: 64-wide, 2 layers, 2 heads, FFN 128"

[run]
seed = 42
device = "auto"
output = "results/M0-small"

[data]
root = "data/publish/data"
dataset = "NF-UNSW-NB15-v3"
horizon_minutes = 10
max_events = 8
batch_size = 256
workers = 4

[split]
train_fraction = 0.70
validation_fraction = 0.15
purge_minutes = 60

[model]
kind = "small"
d_model = 64
layers = 2
heads = 2
ffn = 128
dropout = 0.1

[train]
epochs = 20
patience = 5
learning_rate = 0.0003
weight_decay = 0.05
warmup_fraction = 0.05
gradient_clip = 1.0
amp = true
