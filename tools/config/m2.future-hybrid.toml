description = "Hybrid prediction plus later endpoint-related teacher targets"

[run]
seed = 42
device = "auto"
output = "results/M2-future-hybrid"

[data]
root = "data"
dataset = "NF-CSE-CIC-IDS2018-v3"
horizon_minutes = 10
max_events = 256
batch_size = 256
workers = 4

[split]
train_fraction = 0.70
validation_fraction = 0.15
purge_minutes = 60

[model]
kind = "future-hybrid"
d_model = 256
layers = 4
heads = 8
ffn = 1024
dropout = 0.1

[train]
epochs = 20
patience = 5
learning_rate = 0.0003
weight_decay = 0.05
warmup_fraction = 0.05
gradient_clip = 1.0
amp = true

[pretrain]
epochs = 20
mask_fraction = 0.30
span = 3
ema_start = 0.99
ema_end = 0.9999
