description = "25M causal FlowTransformer matched to M0 Base"

[run]
seed = 42
device = "auto"
output = "outs/m0-matched"

[data]
root = "data/publish/data"
development = [
  "NF-UNSW-NB15-v3",
  "NF-BoT-IoT-v3",
  "NF-ToN-IoT-v3",
]
holdout = "NF-CICIDS2018-v3"
horizon_minutes = 10
max_events = 256
batch_size = 256
workers = 4

[split]
train_fraction = 0.70
validation_fraction = 0.15
purge_minutes = 60

[model]
kind = "matched"
d_model = 512
layers = 8
heads = 8
ffn = 1792
dropout = 0.1

[train]
epochs = 20
patience = 5
learning_rate = 0.0003
weight_decay = 0.05
warmup_fraction = 0.05
gradient_clip = 1.0
amp = true
