name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.76.2
          frozen: true
      - run: pixi run --frozen check
      - name: Package model
        run: |
          git archive --format=tar.gz --prefix=flowids/ --output=flowids.tar.gz "$GITHUB_SHA"
          pixi run --frozen release-check flowids.tar.gz
          sha256sum flowids.tar.gz > flowids.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          flowids.tar.gz flowids.tar.gz.sha256
