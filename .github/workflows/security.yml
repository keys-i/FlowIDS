name: Security

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/security.yml"
      - "pixi.lock"
      - "pixi.toml"
      - "src/**/*.py"
      - "tools/scripts/**/*.py"
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "pixi.lock"
      - "pixi.toml"
      - "src/**/*.py"
      - "tools/scripts/**/*.py"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
